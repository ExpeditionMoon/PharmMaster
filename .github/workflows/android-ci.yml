name: Android CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-quality-gate:
    name: Android quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI configuration
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          cat > secret.properties <<'EOF'
          MAPS_API_KEY=ci-placeholder
          KAKAO_REST_API_KEY=ci-placeholder
          PUBLIC_DATA_SERVICE_KEY=ci-placeholder
          FCM_SERVER_URL=https://example.invalid
          EOF
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "pharmmaster-ci",
              "storage_bucket": "pharmmaster-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.moon.pharm"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run Android quality gate
        run: |
          ./gradlew \
            :domain:test \
            :data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-gate-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/test-results/**
